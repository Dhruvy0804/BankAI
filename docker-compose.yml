name: bankai
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bankai
      POSTGRES_PASSWORD: bankai_dev_only
      POSTGRES_DB: bankai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bankai_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankai -d bankai"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://bankai:bankai_dev_only@db:5432/bankai
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
  evaluation-worker:
    profiles: ["evaluation"]
    build: ./backend
    command: ["python", "-m", "evals.run_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://bankai:bankai_dev_only@db:5432/bankai
    volumes:
      - ./data:/app/data:ro
    depends_on:
      backend:
        condition: service_healthy
  livekit:
    profiles: ["voice"]
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}", "--keys", "${LIVEKIT_API_KEY:-disabled}: ${LIVEKIT_API_SECRET:-disabled}"]
    volumes:
      - ./infra/livekit.local.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
volumes:
  bankai_data:
