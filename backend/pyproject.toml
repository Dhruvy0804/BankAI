[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bankai-backend"
version = "0.1.0"
description = "BankAI local synthetic banking prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.133,<=0.141.1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "google-genai>=1,<3",
  "google-adk[a2a]==2.12.0",
  "crewai==1.15.28",
  "a2a-sdk[http-server]==0.3.26",
  "mcp==1.28.1",
  "livekit==1.1.21",
  "livekit-api==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100
