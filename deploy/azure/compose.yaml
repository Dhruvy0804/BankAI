name: bankai-azure
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bankai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/azure/.env}
      POSTGRES_DB: bankai
    volumes:
      - bankai_data:/var/lib/postgresql/data
      - ../../infra/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankai -d bankai"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ../../backend
    env_file: .env
    environment:
      APP_ENV: cloud_demo
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/azure/.env}
      AGENT_BASE_URL: http://backend:8000
      LIVEKIT_URL: wss://${PUBLIC_HOST:?set PUBLIC_HOST in deploy/azure/.env}
      LIVEKIT_INTERNAL_URL: ws://livekit:7880
      PHONE_PUBLIC_BASE_URL: https://${PUBLIC_HOST}
      CORS_ORIGINS: https://${PUBLIC_HOST}
    volumes:
      - ../../data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
    restart: unless-stopped

  evaluation-worker:
    profiles: ["evaluation"]
    build: ../../backend
    command: ["python", "-m", "evals.run_worker"]
    env_file: .env
    environment:
      APP_ENV: cloud_demo
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ../../data:/app/data:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${AZURE_PUBLIC_IP:?set AZURE_PUBLIC_IP in deploy/azure/.env}", "--keys", "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in deploy/azure/.env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/azure/.env}"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.azure
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  bankai_data:
  caddy_data:
  caddy_config:
